<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fetch Float</title>
</head>
<body>
  <div id="value">0.0</div>
  <button id="fetchBtn">Fetch Float</button>

  <script>
    async function getFloat() {
      console.log('Fetch button clicked!');
      try {
        const response = await fetch('/flo');
        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }
        const text = await response.text();
        document.getElementById('value').textContent = text.trim();
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('value').textContent = 'Error fetching data';
      }
    }
    document.getElementById('fetchBtn').addEventListener('click', getFloat);
  </script>
</body>
</html>
